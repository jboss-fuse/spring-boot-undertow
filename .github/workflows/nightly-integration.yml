# This workflow runs the Spring Boot Web Server TCK against this project.
# The TCK needs the spring-boot-web-server test-fixtures and spring-boot-test-support
# jars, which Spring Boot does not publish to Maven Central. Build them from the
# Spring Boot tag matching our version and install them into the local Maven repository.

name: Nightly TCK

on:
  schedule:
    - cron: '0 2 * * *' # Every day at 02:00 UTC
  workflow_dispatch:

# Only run the latest job
concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-fixtures:
    name: Build Spring Boot test fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.boot-version.outputs.version }}
    steps:
      - name: Checkout spring-boot-undertow
        uses: actions/checkout@v6

      # Spring Boot's own build requires JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Read Spring Boot version from POM
        id: boot-version
        shell: bash
        run: |
          VERSION=$(./mvnw -B help:evaluate -Dexpression=version.org.springframework.boot -DforceStdout -q)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Spring Boot version: ${VERSION}"

      - name: Checkout Spring Boot
        uses: actions/checkout@v6
        with:
          repository: spring-projects/spring-boot
          ref: v${{ steps.boot-version.outputs.version }}
          path: spring-boot

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Spring Boot test fixtures
        working-directory: spring-boot
        shell: bash
        run: ./gradlew :module:spring-boot-web-server:testFixturesJar :test-support:spring-boot-test-support:jar

      - name: Upload test fixtures
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-fixtures
          path: |
            spring-boot/module/spring-boot-web-server/build/libs/spring-boot-web-server-*-test-fixtures.jar
            spring-boot/test-support/spring-boot-test-support/build/libs/spring-boot-test-support-*.jar
          retention-days: 1

  tck:
    name: TCK - JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    needs: build-fixtures
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21, 25]
    steps:
      - name: Checkout spring-boot-undertow
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: 'maven'

      - name: Download test fixtures
        uses: actions/download-artifact@v8
        with:
          name: spring-boot-fixtures
          path: fixtures

      - name: Install test fixtures into the local Maven repository
        shell: bash
        env:
          BOOT_VERSION: ${{ needs.build-fixtures.outputs.version }}
        run: |
          ./mvnw -B install:install-file \
            -Dfile="$(find fixtures -name "spring-boot-web-server-${BOOT_VERSION}-test-fixtures.jar")" \
            -DgroupId=org.springframework.boot -DartifactId=spring-boot-web-server \
            -Dversion="${BOOT_VERSION}" -Dclassifier=test-fixtures -Dpackaging=jar -DgeneratePom=false
          ./mvnw -B install:install-file \
            -Dfile="$(find fixtures -name "spring-boot-test-support-${BOOT_VERSION}.jar")" \
            -DgroupId=org.springframework.boot -DartifactId=spring-boot-test-support \
            -Dversion="${BOOT_VERSION}" -Dpackaging=jar -DgeneratePom=true

      - name: Run TCK
        run: ./mvnw -B verify -Ptck -pl module/undertow-spring-boot-autoconfigure

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports-tck-${{ matrix.jdk }}
          path: |
            **/surefire*-reports/*.txt
            **/*.dump*
